<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Meme Bhel — Better Luck</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#5a3416;
}

.page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;

    background:
        radial-gradient(circle at 50% 45%,
        #fff6d8 0%,
        #fbe3a4 60%,
        #f4d183 100%);
}

/* =========================
   TOP
========================= */

.top{
    position:relative;
    z-index:3;
    background:#2f8a3e;
    padding:24px 16px 55px;
    text-align:center;

    border-radius:0 0 50% 50% / 0 0 60px 60px;

    box-shadow:0 14px 0 #43a047;
}

.top h1{
    margin:0;

    font-size:clamp(32px,8vw,54px);

    color:#fff;

    text-shadow:3px 3px 0 #7a2b12;
}

/* =========================
   MAIN
========================= */

main{
    position:relative;
    z-index:2;

    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px 15px 60px;
}

.card{
    position:relative;
    z-index:4;

    width:min(92vw,460px);

    background:#fff;

    border-radius:20px;

    padding:18px;

    text-align:center;

    transform:rotate(-1deg);

    box-shadow:0 12px 30px rgba(0,0,0,.28);
}

/* =========================
   PROMO
========================= */

.promo-title{
    margin:2px 0 12px;

    font-size:18px;
    font-weight:900;

    color:#8a1c0f;

    text-transform:uppercase;

    line-height:1.25;
}

.promo{
    width:100%;

    overflow:hidden;

    border-radius:14px;

    background:#111;

    box-shadow:0 5px 12px rgba(0,0,0,.2);

    margin-bottom:14px;
}

.promo img{
    display:block;

    width:100%;
    height:auto;

    max-height:300px;

    object-fit:contain;
}

/* =========================
   START SCREEN
========================= */

#start h2{
    margin:8px 0 14px;

    color:#8a1c0f;

    font-size:21px;
}

button{
    border:0;

    border-radius:14px;

    padding:16px 24px;

    font-size:19px;
    font-weight:700;

    cursor:pointer;

    background:#c4271b;
    color:#fff;

    width:100%;

    box-shadow:0 5px 0 #7a160d;

    transition:.15s ease;
}

button:hover{
    background:#d52d20;

    transform:translateY(-2px);
}

button:active{
    transform:translateY(3px);

    box-shadow:0 1px 0 #7a160d;
}

button:disabled{
    cursor:not-allowed;

    opacity:.9;
}

/* =========================
   COUNTDOWN
========================= */

.countdown{
    display:none;

    padding:20px 10px 15px;
}

.countdown-text{
    font-size:18px;

    font-weight:800;

    color:#8a1c0f;

    margin-bottom:5px;
}

#countNumber{
    font-size:90px;

    line-height:1;

    font-weight:900;

    color:#c4271b;

    text-shadow:4px 4px 0 #f2c58c;

    animation:pulse .8s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

    100%{
        transform:scale(1);
    }
}

/* =========================
   LOSING RESULT
========================= */

.result{
    display:none;
}

.result .msg{
    font-size:24px;

    font-weight:900;

    color:#8a1c0f;

    margin:5px 0 8px;
}

.result .submsg{
    font-size:15px;

    font-weight:700;

    color:#555;

    margin-bottom:12px;
}

.result img{
    display:block;

    width:100%;

    height:auto;

    max-height:55vh;

    object-fit:contain;

    border-radius:12px;

    background:#000;

    box-shadow:0 6px 15px rgba(0,0,0,.25);
}

/* =========================
   POLAROIDS
========================= */

.pol{
    position:absolute;

    z-index:1;

    width:84px;
    height:84px;

    background:#fff;

    border-radius:10px;

    padding:7px;

    box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.pol img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:4px;

    display:block;
}

.p1{
    top:14px;
    left:10px;

    transform:rotate(-8deg);
}

.p2{
    top:40px;
    right:10px;

    transform:rotate(9deg);
}

.p3{
    bottom:14px;
    left:12px;

    transform:rotate(7deg);
}

.p4{
    bottom:14px;
    right:12px;

    transform:rotate(7deg);
}

/* =========================
   DECORATIONS
========================= */

.d{
    position:absolute;

    z-index:0;

    pointer-events:none;
}

.rice{
    width:26px;
    height:16px;

    border-radius:50%;

    background:#fffaf0;

    opacity:.85;

    top:120px;
    left:20px;

    box-shadow:
    120px 60px #fffaf0,
    260px 20px #fffaf0,
    60px 210px #fffaf0,
    200px 300px #fffaf0,
    320px 240px #fffaf0,
    30px 420px #fffaf0,
    150px 520px #fffaf0,
    300px 470px #fffaf0,
    90px 640px #fffaf0,
    250px 700px #fffaf0,
    340px 600px #fffaf0;
}

.sq{
    width:11px;
    height:11px;

    border-radius:2px;

    background:#d8392b;

    top:180px;
    left:40px;

    box-shadow:
    200px 40px #d8392b,
    300px 200px #d8392b,
    80px 330px #d8392b,
    250px 430px #d8392b,
    30px 560px #d8392b,
    330px 640px #d8392b,
    160px 720px #d8392b;
}

.leaf{
    width:18px;
    height:26px;

    border-radius:0 100% 0 100%;

    background:#4c9f50;

    top:240px;
    left:150px;

    box-shadow:
    -110px 120px #4c9f50,
    160px 160px #4c9f50,
    40px 380px #4c9f50,
    200px 560px #4c9f50,
    -90px 640px #4c9f50;
}

/* =========================
   BOTTOM
========================= */

.bottom{
    position:relative;

    z-index:3;

    background:#c4271b;

    padding:40px 16px 22px;

    border-radius:50% 50% 0 0 / 40px 40px 0 0;

    margin-top:-20px;
}

.bottom:after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:45%;

    background:#7a4518;

    z-index:-1;
}

.credits{
    max-width:440px;

    margin:0 auto;

    background:#fdf0cf;

    border-radius:16px;

    padding:12px 10px;

    text-align:center;
}

.credits b{
    display:block;

    color:#c4271b;

    letter-spacing:4px;

    font-size:14px;

    margin-bottom:4px;
}

.credits span{
    font-size:17px;

    color:#222;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top{
        padding:20px 12px 48px;
    }

    .top h1{
        font-size:36px;
    }

    main{
        padding:25px 12px 50px;
    }

    .card{
        width:94vw;

        padding:15px;

        transform:rotate(0);
    }

    .promo-title{
        font-size:16px;
    }

    .promo img{
        max-height:230px;
    }

    #start h2{
        font-size:18px;
    }

    button{
        font-size:17px;

        padding:15px 18px;
    }

    #countNumber{
        font-size:75px;
    }

    .result .msg{
        font-size:21px;
    }

    .pol{
        width:62px;
        height:62px;

        padding:5px;
    }

    .p1{
        top:8px;
        left:4px;
    }

    .p2{
        top:12px;
        right:4px;
    }

    .p3,
    .p4{
        display:none;
    }

    .bottom{
        padding-top:30px;
    }

    .credits span{
        font-size:14px;
    }
}

/* EXTRA SMALL PHONES */

@media(max-width:380px){

    .top h1{
        font-size:31px;
    }

    .card{
        width:95vw;
    }

    .promo img{
        max-height:190px;
    }

    #countNumber{
        font-size:65px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- Decorations -->
    <div class="d rice"></div>
    <div class="d sq"></div>
    <div class="d leaf"></div>


    <!-- Header -->

    <div class="top">
        <h1>The Meme Bhel</h1>
    </div>


    <main>

        <!-- Polaroids -->

        <div class="pol p1">
            <img src="loose2.jpeg" alt="">
        </div>

        <div class="pol p2">
            <img src="loose5.jpeg" alt="">
        </div>

        <div class="pol p3">
            <img src="loose8.jpeg" alt="">
        </div>

        <div class="pol p4">
            <img src="chance2.jpeg" alt="">
        </div>


        <!-- Main Card -->

        <div class="card">


            <!-- START SCREEN -->

            <div id="start">

                <div class="promo-title">
                    🎁 GET THIS MEME & STAND A CHANCE TO WIN A PRIZE 🎁
                </div>

                <div class="promo">
                    <img src="win.jpeg" alt="Prize Meme">
                </div>

                <h2>
                    You might be the lucky one… 👀
                </h2>

                <button id="tryBtn">
                    GENERATE MY MEME 🎲
                </button>

            </div>


            <!-- COUNTDOWN -->

            <div class="countdown" id="countdown">

                <div class="countdown-text">
                    YOUR MEME IS BEING GENERATED...
                </div>

                <div id="countNumber">
                    5
                </div>

                <div class="countdown-text">
                    Get ready! 🎉
                </div>

            </div>


            <!-- LOSING RESULT -->

            <div class="result" id="result">

                <div class="msg">
                     OOPS! BETTER LUCK NEXT TIME!
                </div>

                <div class="submsg">
                     Enjoy your Meme-Bhel !!!
                </div>

                <div class="promo">
                    <img id="losingMeme" src="" alt="Losing Meme">
                </div>

            </div>


        </div>

    </main>


    <!-- Footer -->

    <div class="bottom">

        <div class="credits">

            <b>CREDITS</b>

            <span>
                Harsh · Arif · Yash · Shaswati · Antara · Rashi
            </span>

        </div>

    </div>

</div>


<script>

/* =========================
   LOSING MEMES
========================= */

const memes = [
    "loose1.jpeg",
    "loose2.jpeg",
    "loose3.jpeg",
    "loose4.jpeg",
    "loose5.jpeg",
    "loose6.jpeg",
    "loose7.jpeg",
    "loose8.jpeg"
];


/* =========================
   ELEMENTS
========================= */

const tryBtn = document.getElementById("tryBtn");

const start = document.getElementById("start");

const countdown = document.getElementById("countdown");

const countNumber = document.getElementById("countNumber");

const result = document.getElementById("result");

const losingMeme = document.getElementById("losingMeme");


/* =========================
   BUTTON
========================= */

tryBtn.addEventListener("click", function(){

    /* Disable button */

    tryBtn.disabled = true;

    tryBtn.textContent = "GENERATING... ⏳";


    /* Hide start */

    start.style.display = "none";


    /* Show countdown */

    countdown.style.display = "block";


    /* Start at 5 */

    let count = 5;

    countNumber.textContent = count;


    /* Countdown */

    const timer = setInterval(function(){

        count--;


        if(count > 0){

            countNumber.textContent = count;

        }

        else{

            clearInterval(timer);

            countNumber.textContent = "😂";


            setTimeout(function(){

                /* Random meme */

                const randomIndex =
                    Math.floor(Math.random() * memes.length);


                losingMeme.src = memes[randomIndex];


                /* Hide countdown */

                countdown.style.display = "none";


                /* Show result */

                result.style.display = "block";

            },700);

        }

    },1000);

});

</script>

</body>
</html>
